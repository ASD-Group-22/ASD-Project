name: Student 2 - Skill Exchange CI

on:
  push:
    paths:
      - "student-2/**"
      - ".github/workflows/student-2-ci.yml"

  pull_request:
    paths:
      - "student-2/**"
      - ".github/workflows/student-2-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_FILE: student-2/docker-compose.yml
  COMPOSE_PROJECT_NAME: student2-ci

jobs:
  build-images:
    name: Build Student 2 Images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cp student-2/.env.example student-2/.env
          sed -i 's/^AI_ENABLED=.*/AI_ENABLED=false/' student-2/.env
          sed -i 's/^MCP_ENABLED=.*/MCP_ENABLED=false/' student-2/.env
          sed -i 's/^RAG_ENABLED=.*/RAG_ENABLED=false/' student-2/.env
          sed -i 's/^MULTI_AGENT_ENABLED=.*/MULTI_AGENT_ENABLED=false/' student-2/.env

      - name: Verify Docker Compose
        run: docker compose version

      - name: Validate Compose configuration
        run: |
          docker compose \
            --env-file student-2/.env \
            -f "${COMPOSE_FILE}" \
            config

      - name: Build Student 2 service images
        run: |
          docker compose \
            --env-file student-2/.env \
            -f "${COMPOSE_FILE}" \
            build

  smoke-check:
    name: Run Student 2 Validation
    runs-on: ubuntu-latest
    needs: build-images
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cp student-2/.env.example student-2/.env
          sed -i 's/^AI_ENABLED=.*/AI_ENABLED=false/' student-2/.env
          sed -i 's/^MCP_ENABLED=.*/MCP_ENABLED=false/' student-2/.env
          sed -i 's/^RAG_ENABLED=.*/RAG_ENABLED=false/' student-2/.env
          sed -i 's/^MULTI_AGENT_ENABLED=.*/MULTI_AGENT_ENABLED=false/' student-2/.env

      - name: Set up Python for Release 2 endpoint tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Release 2 endpoint test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r student-2/tests/release2/requirements.txt

      - name: Start Student 2 services
        run: |
          docker compose \
            --env-file student-2/.env \
            -f "${COMPOSE_FILE}" \
            up -d --build

      - name: Verify shared AI services are disabled in CI
        shell: bash
        run: |
          set -e

          ai_enabled=$(docker compose --env-file student-2/.env -f "${COMPOSE_FILE}" exec -T student-2-skill-exchange-backend printenv AI_ENABLED)
          mcp_enabled=$(docker compose --env-file student-2/.env -f "${COMPOSE_FILE}" exec -T student-2-skill-exchange-backend printenv MCP_ENABLED)
          rag_enabled=$(docker compose --env-file student-2/.env -f "${COMPOSE_FILE}" exec -T student-2-skill-exchange-backend printenv RAG_ENABLED)
          multi_agent_enabled=$(docker compose --env-file student-2/.env -f "${COMPOSE_FILE}" exec -T student-2-skill-exchange-backend printenv MULTI_AGENT_ENABLED)

          echo "AI_ENABLED=${ai_enabled}"
          echo "MCP_ENABLED=${mcp_enabled}"
          echo "RAG_ENABLED=${rag_enabled}"
          echo "MULTI_AGENT_ENABLED=${multi_agent_enabled}"

          test "${ai_enabled}" = "false"
          test "${mcp_enabled}" = "false"
          test "${rag_enabled}" = "false"
          test "${multi_agent_enabled}" = "false"

      - name: Wait for services
        shell: bash
        run: |
          set -e

          check_url() {
            url="$1"

            for attempt in {1..8}; do
              status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)

              if [ "$status" = "200" ]; then
                echo "PASS $url -> HTTP 200"
                return 0
              fi

              echo "Attempt $attempt/8: $url returned $status"
              sleep 2
            done

            echo "FAIL: $url did not become ready"
            return 1
          }

          check_url "http://localhost:8202/"
          check_url "http://localhost:5202/"
          check_url "http://localhost:5302/"
          check_url "http://localhost:5202/skill-exchange"

      - name: Run Student 2 smoke test
        shell: pwsh
        run: ./student-2/scripts/smoke_test.ps1

      - name: Run Student 2 CRUD and matching test
        shell: pwsh
        run: ./student-2/scripts/api_crud_test.ps1

      - name: Run Release 2 post-commit endpoint tests
        run: |
          mkdir -p reports
          python -m pytest student-2/tests/release2/test_endpoints.py -v --junitxml=reports/student-2-release2-endpoints.xml

      - name: Upload Release 2 endpoint test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-2-release2-endpoint-tests-${{ github.run_id }}
          path: reports/student-2-release2-endpoints.xml
          if-no-files-found: warn

      - name: Show service status
        if: always()
        run: |
          docker compose \
            --env-file student-2/.env \
            -f "${COMPOSE_FILE}" \
            ps

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose \
            --env-file student-2/.env \
            -f "${COMPOSE_FILE}" \
            logs --no-color

      - name: Stop Student 2 services
        if: always()
        run: |
          docker compose \
            --env-file student-2/.env \
            -f "${COMPOSE_FILE}" \
            down -v

  evidence-pack:
    name: Create CI Evidence
    runs-on: ubuntu-latest
    needs: smoke-check
    timeout-minutes: 5

    steps:
      - name: Create evidence report
        shell: bash
        run: |
          mkdir -p reports

          cat > reports/student-2-ci-report.md <<EOF
          # Student 2 - Skill Exchange CI Evidence

          - Workflow: ${GITHUB_WORKFLOW}
          - Run ID: ${GITHUB_RUN_ID}
          - Commit SHA: ${GITHUB_SHA}
          - Branch: ${GITHUB_REF_NAME}
          - Repository: ${GITHUB_REPOSITORY}
          - Result: PASSED
          - UTC Time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          ## Validation

          - Student 2 Docker images built successfully.
          - Student 2 Compose configuration validated.
          - AI Mode was verified disabled during CI.
          - MCP Mode was verified disabled during CI.
          - RAG Mode was verified disabled during CI.
          - Frontend health check returned HTTP 200.
          - Backend health check returned HTTP 200.
          - Database service health check returned HTTP 200.
          - Skill Exchange API returned HTTP 200.
          - Smoke test passed.
          - CRUD, search, and deterministic matching validation passed.
          - Release 2 post-commit endpoint test 1 passed: GET /skill-exchange/search?skill=Python.
          - Release 2 post-commit endpoint test 2 passed: GET /skill-exchange/1/matches.
          - Pytest JUnit evidence was generated for the two Release 2 endpoint tests.

          ## Scope

          This workflow validates the Student 2 Skill Exchange microservices.
          AI model execution is validated separately using the local Ollama runtime.
          EOF

          echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > reports/run-url.txt

      - name: Upload CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: student-2-ci-evidence-${{ github.run_id }}
          path: reports/
          retention-days: 14
