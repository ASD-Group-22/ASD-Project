name: Student 5 - Campus Space Finder CI

on:
  push:
    paths:
      - 'student-5/**'
      - 'ai-services/**'
      - '.github/workflows/student-5-ci.yml'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'student-5/**'
      - 'ai-services/**'
      - '.github/workflows/student-5-ci.yml'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-5-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      AI_MODE: 'false'
      MCP_MODE: 'false'
      RAG_MODE: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            student-5/database/requirements.txt
            student-5/backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install database dependencies
        run: |
          python -m pip install -r student-5/database/requirements.txt
          python -m pip install pytest

      - name: Run database tests
        working-directory: student-5/database
        run: python -m pytest -q tests

      - name: Install backend dependencies
        run: |
          python -m pip install -r student-5/backend/requirements.txt
          python -m pip install pytest

      - name: Run backend tests
        working-directory: student-5/backend
        env:
          AGENTIC_LOG_PATH: ${{ runner.temp }}/student-5-logs/agentic-loop.jsonl
        run: python -m pytest -q tests


      - name: Release 2 GET and POST endpoint tests
        working-directory: student-5/backend
        env:
          AI_MODE: 'false'
          MCP_MODE: 'false'
          RAG_MODE: 'false'
          MULTI_AGENT_MODE: 'false'
        run: python -m pytest -v tests/test_release2_endpoints.py

      - name: Check Student 5 Python syntax
        run: |
          python -m compileall -q student-5
          python -m py_compile \
            ai-services/mcp-server/tools/student5.py \
            ai-services/rag-server/sources/student5.py \
            ai-services/agentic-loop/scenarios/student5.py

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Student 5 Docker images
        run: |
          docker compose build \
            student-5-database \
            student-5-backend \
            student-5-frontend