<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Projects</title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

</head>


<body>

<main>

    <div class="normal-container">

        <!-- Header -->

        <div class="normal-header">

            <h2>Project Management</h2>

            <p>
                Create, view and manage your university projects.
            </p>

        </div>


        <!-- Create Project -->

        <div class="project-input-card">

            <h3>Create Project</h3>

            <form id="create-project-form">

                <div class="form-group">

                    <label for="name">
                        Project Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter project name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe the project"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="requirements">
                        Requirements
                    </label>

                    <textarea
                        id="requirements"
                        name="requirements"
                        placeholder="Enter the project requirements"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="owner_id">
                        Owner ID
                    </label>

                    <input
                        type="number"
                        id="owner_id"
                        name="owner_id"
                        placeholder="Enter owner ID"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="start_date">
                            Start Date
                        </label>

                        <input
                            type="date"
                            id="start_date"
                            name="start_date"
                        >

                    </div>


                    <div class="form-group">

                        <label for="deadline">
                            Deadline
                        </label>

                        <input
                            type="date"
                            id="deadline"
                            name="deadline"
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="create-button"
                >
                    Create Project
                </button>

            </form>


            <p id="create-message"></p>

        </div>


        <!-- Projects -->

        <div class="projects-section">

            <div class="projects-header">

                <h3>Your Projects</h3>

                <button
                    id="refresh-projects"
                    class="refresh-button"
                >
                    Refresh Projects
                </button>

            </div>


            <div id="projects-list">

                <p class="projects-message">
                    Loading projects...
                </p>

            </div>

        </div>

    </div>

</main>


<script>

const API_URL = "http://localhost:5001";


/* -----------------------------------------------
   LOAD PROJECTS
------------------------------------------------ */

async function loadProjects() {

    const projectsList =
        document.getElementById("projects-list");

    projectsList.innerHTML = `
        <p class="projects-message">
            Loading projects...
        </p>
    `;

    try {

        const response = await fetch(
            `${API_URL}/projects`
        );

        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}`
            );

        }

        const projects = await response.json();

        projectsList.innerHTML = "";


        if (projects.length === 0) {

            projectsList.innerHTML = `
                <p class="projects-message">
                    No projects found.
                </p>
            `;

            return;
        }


        projects.forEach(project => {

            const projectElement =
                document.createElement("article");

            projectElement.className =
                "project-card";


            projectElement.innerHTML = `

                <h4>
                    ${project.name}
                </h4>

                <p>
                    ${project.description || "No description"}
                </p>

                <p>
                    <strong>Requirements:</strong><br>
                    ${project.requirements || "None"}
                </p>

                <p>
                    <strong>Owner:</strong>
                    ${project.owner_id}
                </p>

                <p>
                    <strong>Start Date:</strong>
                    ${project.start_date || "Not set"}
                </p>

                <p>
                    <strong>Deadline:</strong>
                    ${project.deadline || "Not set"}
                </p>

                <p>
                    <strong>Status:</strong>
                    <span class="project-status">
                        ${project.status}
                    </span>
                </p>

                <button
                    class="delete-button"
                    onclick="deleteProject(${project.id})"
                >
                    Delete Project
                </button>

            `;


            projectsList.appendChild(
                projectElement
            );

        });


    } catch (error) {

        console.error(
            "Failed to load projects:",
            error
        );

        projectsList.innerHTML = `

            <p class="projects-message">
                Failed to connect to the project service.
                <br><br>
                Make sure project-service is running
                on port 5001.
            </p>

        `;
    }
}


/* -----------------------------------------------
   CREATE PROJECT
------------------------------------------------ */

document
    .getElementById("create-project-form")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const message =
                document.getElementById(
                    "create-message"
                );


            const project = {

                name:
                    document.getElementById(
                        "name"
                    ).value,

                description:
                    document.getElementById(
                        "description"
                    ).value,

                requirements:
                    document.getElementById(
                        "requirements"
                    ).value,

                owner_id:
                    Number(
                        document.getElementById(
                            "owner_id"
                        ).value
                    ),

                start_date:
                    document.getElementById(
                        "start_date"
                    ).value,

                deadline:
                    document.getElementById(
                        "deadline"
                    ).value,

                status: "Not Started"
            };


            try {

                const response = await fetch(
                    `${API_URL}/projects`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(project)
                    }
                );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.error ||
                        "Failed to create project"
                    );

                }


                message.textContent =
                    "Project created successfully.";


                document
                    .getElementById(
                        "create-project-form"
                    )
                    .reset();


                await loadProjects();


            } catch (error) {

                console.error(error);

                message.textContent =
                    `Error: ${error.message}`;
            }

        }
    );


/* -----------------------------------------------
   DELETE PROJECT
------------------------------------------------ */

async function deleteProject(projectId) {

    const confirmed = confirm(
        "Are you sure you want to delete this project?"
    );


    if (!confirmed) {
        return;
    }


    try {

        const response = await fetch(
            `${API_URL}/projects/${projectId}`,
            {
                method: "DELETE"
            }
        );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "Failed to delete project"
            );

        }


        await loadProjects();


    } catch (error) {

        console.error(error);

        alert(
            `Failed to delete project: ${error.message}`
        );
    }
}


/* -----------------------------------------------
   REFRESH
------------------------------------------------ */

document
    .getElementById("refresh-projects")
    .addEventListener(
        "click",
        loadProjects
    );


/* -----------------------------------------------
   INITIAL LOAD
------------------------------------------------ */

loadProjects();

</script>

</body>

</html>
