services:

  student-1-database-service:
    build:
      context: ./database
    container_name: student-1-database-service

    ports:
      - "6001:6001"

    volumes:
      - database-data:/app/data

    restart: unless-stopped


  student-1-backend-service:
    build:
      context: ./backend
    container_name: student-1-backend-service

    ports:
      - "5001:5001"

    environment:
      DATABASE_SERVICE_URL: http://database-service:6001
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_REVIEW_MODEL: ${OLLAMA_REVIEW_MODEL}

    depends_on:
      - database-service

    restart: unless-stopped


  student-1-frontend-service:
    build:
      context: ./frontend
    container_name: student-1-frontend-service

    ports:
      - "3001:80"

    depends_on:
      - backend-service

    restart: unless-stopped


volumes:
  database-data: