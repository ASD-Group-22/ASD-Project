services:
  student-2-skill-exchange-frontend:
    build:
      context: ./frontend-service
    container_name: student-2-skill-exchange-frontend
    ports:
      - "8202:80"
    depends_on:
      - student-2-skill-exchange-backend
    networks: [student-2-network]
    restart: unless-stopped

  student-2-skill-exchange-backend:
    build:
      context: .
      dockerfile: backend-service/Dockerfile
    container_name: student-2-skill-exchange-backend
    ports:
      - "5202:5001"
    environment:
      DATABASE_SERVICE_URL: http://student-2-skill-exchange-database:5002
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_REVIEW_MODEL: ${OLLAMA_REVIEW_MODEL:-llama3.1:8b}
      ENABLE_REVIEW_MODEL: ${ENABLE_REVIEW_MODEL:-true}
      SKILL_PROFILE_SERVICE_URL: ${SKILL_PROFILE_SERVICE_URL:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_URL: ${MCP_URL:-http://host.docker.internal:5100/mcp}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://host.docker.internal:5003}
      MULTI_AGENT_ENABLED: ${MULTI_AGENT_ENABLED:-true}
      MULTI_AGENT_SERVICE_URL: ${MULTI_AGENT_SERVICE_URL:-http://host.docker.internal:5101}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - student-2-skill-exchange-database
    networks: [student-2-network]
    restart: unless-stopped

  student-2-skill-exchange-database:
    build:
      context: ./database-service
    container_name: student-2-skill-exchange-database
    ports:
      - "5302:5002"
    volumes:
      - student_2_skill_exchange_data:/app/data
    networks: [student-2-network]
    restart: unless-stopped

volumes:
  student_2_skill_exchange_data:

networks:
  student-2-network:
    driver: bridge
