<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Skill Exchange Service</title>

    <link
        rel="stylesheet"
        href="/css/styles.css"
    >
</head>

<body>

<main class="app-shell">

    <header class="app-header">

        <h1>Skill Exchange Service</h1>

        <p>
            Release 2 · Normal UI · AI Mode · MCP Mode · RAG Mode · Multi-Agent
        </p>

    </header>

    <section class="tab-shell card">

        <nav
            class="tab-nav"
            aria-label="Application tabs"
        >

            <button
                class="tab-btn is-active"
                data-tab="normal"
                type="button"
            >
                Normal UI
            </button>

            <button
                class="tab-btn"
                data-tab="ai-mode"
                type="button"
            >
                AI Mode
            </button>

            <button
                class="tab-btn"
                data-tab="mcp"
                type="button"
            >
                MCP Mode
            </button>

            <button
                class="tab-btn"
                data-tab="rag"
                type="button"
            >
                RAG Mode
            </button>

            <button
                class="tab-btn"
                data-tab="multi-agent"
                type="button"
            >
                Multi-Agent
            </button>

        </nav>


        <div class="tab-content">

            <iframe
                id="tab-normal"
                class="tab-frame is-active"
                src="/tabs/normal.html"
                title="Normal UI"
            ></iframe>

            <iframe
                id="tab-ai-mode"
                class="tab-frame"
                src="/tabs/ai-mode.html"
                title="AI Mode"
            ></iframe>

            <iframe
                id="tab-mcp"
                class="tab-frame"
                src="/tabs/mcp.html"
                title="MCP Mode"
            ></iframe>

            <iframe
                id="tab-rag"
                class="tab-frame"
                src="/tabs/rag.html"
                title="RAG Mode"
            ></iframe>

            <iframe
                id="tab-multi-agent"
                class="tab-frame"
                src="/tabs/multi-agent.html"
                title="Multi-Agent"
            ></iframe>

        </div>

    </section>

</main>


<script>
const buttons = [
    ...document.querySelectorAll('.tab-btn')
];

const frames = {
    normal: document.getElementById('tab-normal'),
    'ai-mode': document.getElementById('tab-ai-mode'),
    mcp: document.getElementById('tab-mcp'),
    rag: document.getElementById('tab-rag'),
    'multi-agent': document.getElementById('tab-multi-agent')
};


function activate(name) {
    buttons.forEach(button => {
        button.classList.toggle(
            'is-active',
            button.dataset.tab === name
        );
    });

    Object.entries(frames).forEach(
        ([key, frame]) => {
            frame.classList.toggle(
                'is-active',
                key === name
            );
        }
    );

    window.location.hash = name;
}


buttons.forEach(button => {
    button.addEventListener(
        'click',
        () => activate(button.dataset.tab)
    );
});


const requested =
    window.location.hash.replace('#', '');


activate(
    frames[requested]
        ? requested
        : 'normal'
);
</script>

</body>
</html>
