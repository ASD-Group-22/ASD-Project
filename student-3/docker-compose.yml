services:
  database-service:
    build: ./database-service
    container_name: student-3-database-service
    restart: unless-stopped
    volumes:
      - ./database-service/data:/app/data
    ports:
      - "6000:6000"

  backend-service:
    build: ./backend-service
    container_name: student-3-backend-service
    restart: unless-stopped
    depends_on:
      - database-service
    volumes:
      - ./backend-service:/app
      - ./prompts:/prompts
      - ./scripts:/scripts
    ports:
      - "5009:5000"
    environment:
      OLLAMA_URL: "http://host.docker.internal:11434"
      DB_URL: "http://database-service:6000"
      AI_ENABLED: "true"
      MCP_ENABLED: "true"
      RAG_ENABLED: "true"
      MCP_URL: "http://host.docker.internal:5100/mcp"
      RAG_SERVICE_URL: "http://host.docker.internal:5003"
      RAG_TIMEOUT_SECONDS: "180"

  frontend-service:
    build: ./frontend-service
    container_name: student-3-frontend-service
    restart: unless-stopped
    depends_on:
      - backend-service
    volumes:
      - ./frontend-service:/app
    ports:
      - "8000:8000"
