<!DOCTYPE html>
<html>
<head>
    <title>Normal Mode</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="container">
    <h1>Normal Mode</h1>

    <div class="form-section">
        <h2>Create Skill Requirements</h2>
        <form id="skillForm">
            <label>Subject:</label>
            <input type="text" id="subject"><br><br>

            <label>Requirements (JSON):</label>
            <textarea id="requirements" rows="5"></textarea><br><br>

            <button type="button" onclick="submitSkillReq()">Save</button>
        </form>
    </div>

    <div class="form-section" style="margin-top: 30px;">
        <h2>Finalise Group</h2>
        <form id="groupForm">
            <label>Subject:</label>
            <input type="text" id="groupSubject"><br><br>

            <label>Members (JSON):</label>
            <textarea id="members" rows="5"></textarea><br><br>

            <button type="button" onclick="finaliseGroup()">Finalise</button>
        </form>
    </div>
</div>

<script>
function submitSkillReq() {
    fetch("http://localhost:5000/ui/skills/create", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            subject: document.getElementById("subject").value,
            requirements: JSON.parse(document.getElementById("requirements").value)
        })
    }).then(r => r.json()).then(alert);
}

function finaliseGroup() {
    fetch("http://localhost:5000/ui/groups/finalise", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            subject: document.getElementById("groupSubject").value,
            members: JSON.parse(document.getElementById("members").value)
        })
    }).then(r => r.json()).then(alert);
}
</script>

</body>
</html>
