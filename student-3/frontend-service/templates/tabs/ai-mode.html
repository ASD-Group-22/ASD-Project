<!DOCTYPE html>
<html>
<head>
    <title>AI Mode</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="container">
    <h1>AI Mode</h1>

    <div class="form-section">
        <h2>AI Group Recommendation</h2>

        <label>Subject:</label>
        <input type="text" id="aiSubject"><br><br>

        <label>Select Model:</label>
        <select id="model">
            <option value="deepseek-r1:8b">deepseek-r1:8b</option>
            <option value="llama3.1:8b">llama3.1:8b</option>
            <option value="qwen2.5:0.5b">qwen2.5:0.5b</option>
        </select><br><br>

        <button onclick="runAI()">Run AI</button>

        <h3>AI Output:</h3>
        <pre id="output"></pre>
    </div>
</div>

<script>
function runAI() {
    fetch("http://localhost:5000/ai/group-recommendation", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            subject: document.getElementById("aiSubject").value,
            model: document.getElementById("model").value
        })
    })
    .then(r => r.json())
    .then(data => {
        document.getElementById("output").textContent = JSON.stringify(data.ai_recommendation, null, 2);
    });
}
</script>

</body>
</html>
